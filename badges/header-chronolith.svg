<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .title-text {
        font-family: 'Nebula', 'Orbitron', monospace;
        font-weight: 900;
        font-size: 18px;
        fill: #FFFFFF !important;
        stroke: #000000;
        stroke-width: 2px;
        paint-order: stroke fill;
        letter-spacing: 3px;
        filter: drop-shadow(0px 0px 8px #FFD700CC);
      }

      .subtitle-text {
        font-family: 'Nebula', 'Orbitron', 'Fira Code', monospace;
        font-weight: 700;
        font-size: 13px;
        fill: #FFD700;
        letter-spacing: 3.5px;
        filter: drop-shadow(0px 0px 6px #FFA500AA);
      }
      
      .badge-text {
        font-family: 'Fira Code', monospace;
        font-size: 10.5px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      
      .pulse-dot {
        animation: pulse 1.8s infinite;
      }
      
      @keyframes pulse {
        0% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
        50% { fill: #FFD700; opacity: 0.4; filter: drop-shadow(0 0 2px #FFD700); }
        100% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
      }

      .glow-border {
        animation: borderGlow 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% { stroke: #FFD700; filter: drop-shadow(0 0 4px #FFD700); }
        50% { stroke: #FFA500; filter: drop-shadow(0 0 6px #FFA500); }
        100% { stroke: #00FF9D; filter: drop-shadow(0 0 4px #00FF9D); }
      }

      .sheen-anim {
        animation: moveSheen 5s ease-in-out infinite alternate;
      }

      @keyframes moveSheen {
        0% { transform: translateX(-350px); }
        100% { transform: translateX(350px); }
      }
    </style>

    <clipPath id="card-chronolith-corner-clip">
      <rect width="950" height="240" rx="16" />
    </clipPath>

    <!-- Engraved Inset 3D Obsidian Base -->
    <linearGradient id="card-chronolith-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#070B14" />
      <stop offset="70%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <linearGradient id="card-chronolith-glass-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFA500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-chronolith-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-chronolith-corner-clip)">
    <!-- GENERATIVE 3D PATTERN -->
    <g opacity="0.85">
      <line x1="475.0" y1="70.0" x2="356.7" y2="108.0" stroke="#FFD700" stroke-width="1.3" opacity="0.50"/>
    <line x1="475.0" y1="70.0" x2="593.3" y2="108.0" stroke="#FFD700" stroke-width="1.3" opacity="0.49"/>
    <line x1="356.7" y1="108.0" x2="262.0" y2="146.0" stroke="#FFD700" stroke-width="1.3" opacity="0.56"/>
    <line x1="356.7" y1="108.0" x2="404.0" y2="146.0" stroke="#FFD700" stroke-width="1.3" opacity="0.49"/>
    <line x1="593.3" y1="108.0" x2="546.0" y2="146.0" stroke="#FFD700" stroke-width="1.3" opacity="0.42"/>
    <line x1="593.3" y1="108.0" x2="688.0" y2="146.0" stroke="#FFD700" stroke-width="1.3" opacity="0.40"/>
    <line x1="262.0" y1="146.0" x2="198.9" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.43"/>
    <line x1="262.0" y1="146.0" x2="277.8" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.38"/>
    <line x1="404.0" y1="146.0" x2="356.7" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.31"/>
    <line x1="404.0" y1="146.0" x2="435.6" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.37"/>
    <line x1="546.0" y1="146.0" x2="514.4" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.38"/>
    <line x1="546.0" y1="146.0" x2="593.3" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.43"/>
    <line x1="688.0" y1="146.0" x2="672.2" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.39"/>
    <line x1="688.0" y1="146.0" x2="751.1" y2="184.0" stroke="#FFD700" stroke-width="1.3" opacity="0.33"/>
    <circle cx="688.0" cy="146.0" r="2.4" fill="#FFA500" opacity="0.35"><animate attributeName="r" values="2.4;3.2;2.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="277.8" cy="184.0" r="2.5" fill="#F7931A" opacity="0.37"><animate attributeName="r" values="2.5;3.3;2.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="356.7" cy="184.0" r="2.6" fill="#F7931A" opacity="0.39"><animate attributeName="r" values="2.6;3.5;2.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="546.0" cy="146.0" r="2.7" fill="#FFA500" opacity="0.43"><animate attributeName="r" values="2.7;3.7;2.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="198.9" cy="184.0" r="3.2" fill="#F7931A" opacity="0.53"><animate attributeName="r" values="3.2;4.3;3.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="435.6" cy="184.0" r="3.4" fill="#F7931A" opacity="0.58"><animate attributeName="r" values="3.4;4.6;3.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="404.0" cy="146.0" r="3.7" fill="#FFA500" opacity="0.66"><animate attributeName="r" values="3.7;5.0;3.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="475.0" cy="70.0" r="3.8" fill="#FFD700" opacity="0.68"><animate attributeName="r" values="3.8;5.1;3.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="751.1" cy="184.0" r="4.1" fill="#F7931A" opacity="0.75"><animate attributeName="r" values="4.1;5.6;4.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="514.4" cy="184.0" r="4.5" fill="#F7931A" opacity="0.84"><animate attributeName="r" values="4.5;6.1;4.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="262.0" cy="146.0" r="4.7" fill="#FFA500" opacity="0.89"><animate attributeName="r" values="4.7;6.4;4.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="672.2" cy="184.0" r="5.0" fill="#F7931A" opacity="0.95"><animate attributeName="r" values="5.0;6.7;5.0" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="593.3" cy="108.0" r="5.1" fill="#FFA500" opacity="0.97"><animate attributeName="r" values="5.1;6.8;5.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="356.7" cy="108.0" r="5.1" fill="#FFA500" opacity="0.98"><animate attributeName="r" values="5.1;6.9;5.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="593.3" cy="184.0" r="5.2" fill="#F7931A" opacity="0.99"><animate attributeName="r" values="5.2;7.0;5.2" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Base Frame -->
    <rect width="950" height="240" rx="16" fill="url(#card-chronolith-base)" stroke="#000000" stroke-width="4"/>
    
    <!-- Tri-stroke Engraved Inset -->
    <rect x="3" y="3" width="944" height="234" rx="14" fill="none" stroke="#000000" stroke-width="3" opacity="0.9"/>
    <rect x="5" y="5" width="940" height="230" rx="13" fill="none" stroke="url(#card-chronolith-glass-bevel)" stroke-width="1.5" />
    <rect x="7" y="7" width="936" height="226" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

    <!-- Moving Light Sheen -->
    <g class="sheen-anim">
      <polygon points="100,0 350,0 150,240 -100,240" fill="url(#card-chronolith-sheen)" />
    </g>

    <!-- Corner L-Accents -->
    <path d="M 18 18 L 75 18 M 18 18 L 18 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 18 L 875 18 M 932 18 L 932 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 18 222 L 75 222 M 18 222 L 18 165" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 222 L 875 222 M 932 222 L 932 165" class="glow-border" stroke-width="3.5" fill="none" />

    <!-- NULLA-LABS Top Command Bar -->
    <rect x="40" y="20" width="870" height="28" rx="8" fill="#020408" stroke="#000000" stroke-width="2"/>
    <rect x="41" y="21" width="868" height="26" rx="7" fill="none" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="60" cy="34" r="4.5" class="pulse-dot" />
    <text x="76" y="38" class="badge-text">NULLA-LABS // OFFICIAL ETHERNIUM ENGRAVED OBSIDIAN MONOLITH</text>
    <text x="780" y="38" class="badge-text" fill="#00FF9D">[ENGRAVED_ACTIVE]</text>

    <!-- Title and Subtitle -->
    <g transform="translate(475, 115)">
      <text text-anchor="middle" class="title-text">Chronolith — Persistent Cognitive Layer</text>
    </g>

    <g transform="translate(475, 198)">
      <text text-anchor="middle" class="subtitle-text">AUTONOMOUS ARCHITECTURES • GPU ENGINE • CONTROL SYSTEMS</text>
    </g>

    <line x1="140" y1="216" x2="810" y2="216" stroke="url(#card-chronolith-glass-bevel)" stroke-width="2.5" />
  </g>
</svg>